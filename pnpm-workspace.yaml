# pnpm 12 reads non-registry project settings here, not from .npmrc.
# Dependency install scripts are not run. node-pty's own install step needs a node-gyp that pnpm does not provide, so the root postinstall
# (scripts/ensure-native-terminal.mjs) builds it when it does not load, which only happens on Linux.
saveExact: true
storeDir: .tools/pnpm-store
verifyDepsBeforeRun: false
allowBuilds:
  node-pty: false
minimumReleaseAgeExclude:
  - '@agentclientprotocol/sdk@2.12.0'
  - '@types/node@26.6.10'
